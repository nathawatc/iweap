[package]
name = "iweap"
version = "1.0.1"
edition = "2024"
rust-version = "1.87"
description = "Secure interactive IWD 802.1X profile generator"
license = "GPL-3.0-or-later"
repository = "https://github.com/nathawatc/iweap"
default-run = "iweap"
keywords = ["iwd", "8021x", "eap", "wifi", "networking"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    "/AGENTS.md",
]
publish = false

[lib]
name = "iweap"
path = "src/lib.rs"

[[bin]]
name = "iweap"
path = "src/main.rs"

[[bin]]
name = "iweap-service"
path = "src/bin/iweap-service.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
async-io = "2.6"
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
zbus = { version = "5.19", features = ["blocking-api"] }
zvariant = "5.15"
zeroize = "1"

[dev-dependencies]
libc = "0.2"
