<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.codeberg.iweap"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.codeberg.iweap"
           send_interface="org.codeberg.iweap1.ProfileInstaller"
           send_member="InspectProfile"/>
    <allow send_destination="org.codeberg.iweap"
           send_interface="org.codeberg.iweap1.ProfileInstaller"
           send_member="InstallProfile"/>
  </policy>
</busconfig>
